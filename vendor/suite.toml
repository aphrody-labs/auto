# Suite Aphrody consommée par le workspace Cargo (dépendances path vers vendor/bun-distribution).
# Une dépendance git Cargo clonerait les 168 sous-modules du dépôt : on fait un clone partiel épinglé.
# Mise à jour : changer `commit`, puis `bun scripts/vendor-suite.ts`.
repo = "https://github.com/aphrody-labs/bun-distribution"
commit = "72de9550bc6a109641e399f4805f92648564deda"
# Crates racines ; leurs dépendances path sont ajoutées automatiquement.
crates = [
  "crates/pdfcraft-cos",
  "crates/pdfcraft-preflight",
  "crates/pdfcraft-create",
  "crates/pdfcraft-organize",
  "crates/pdfcraft-render",
  "crates/gridcraft-xlsx",
  "crates/gridcraft-calc",
  "crates/wordcraft-docx",
  "crates/wordcraft-pdf",
  "crates/pdfcraft-redact",
  "crates/pdfcraft-sign",
  "crates/deckcraft-pptx",
  "crates/deckcraft-pdf",
  "crates/aphrody-rag-core",
]
# Chemins non-crate requis : polices et motifs embarqués (include_bytes!), et les copies corrigées
# de hayro et lopdf dont pdfcraft-render dépend (`[patch.crates-io]` du Cargo.toml racine).
extra = [
  "assets/pdfcraft/fonts",
  "assets/wordcraft/fonts",
  "assets/wordcraft/hyphenation",
  "assets/wordcraft/spelling",
  "apps/pdfcraft/vendor/hayro",
  "apps/pdfcraft/vendor/hayro-interpret",
  "apps/pdfcraft/vendor/hayro-syntax",
  "apps/pdfcraft/vendor/hayro-jbig2",
  "apps/pdfcraft/vendor/lopdf",
]
