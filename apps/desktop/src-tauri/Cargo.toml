# Coque de bureau Tauri 2 : une fenêtre WebView2 / WKWebView / WebKitGTK sur le front web d'auto.
# Hors du workspace Cargo racine (dépendances Tauri lourdes) : `gates:rust` ne la compile pas.
[package]
name = "auto-desktop"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[workspace]

[lib]
name = "auto_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = { version = "2", default-features = false }
url = "2"
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
