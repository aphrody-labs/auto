[workspace]
members = ["."]
resolver = "2"

[package]
name = "auto-ui"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Cross-platform NSH (Native Shell) Rust UI library and static web generator for Auto"

[lib]
name = "auto_ui"
path = "src/lib.rs"

[dependencies]
auto-i18n = { path = "../../crates/auto-i18n" }
auto-model = { path = "../../crates/auto-model" }
auto-theme = { path = "../../crates/auto-theme" }
nsh-base = "0.6.0"
nsh-core = "0.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
nsh-engine = "0.6.0"
nsh-testing = { version = "0.6.0", features = ["live"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
