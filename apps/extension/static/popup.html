<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Auto: Supplier Invoices</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Auto</h1>
      <section id="status" aria-live="polite">
        <p id="summary">Loading...</p>
        <a id="open-link" class="bouton" target="_blank" rel="noopener" hidden>Open Auto</a>
      </section>
      <form id="settings-form" novalidate>
        <h2>Settings</h2>
        <div class="champ">
          <label for="instance">Instance URL</label>
          <input id="instance" name="instance" type="url" inputmode="url" autocomplete="url" required />
        </div>
        <div class="champ">
          <label for="token">API Token</label>
          <input id="token" name="token" type="password" autocomplete="off" spellcheck="false" required />
        </div>
        <p id="error" class="erreur" role="alert" hidden></p>
        <button type="submit" class="bouton bouton-primaire" id="save-btn">Save and test</button>
      </form>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
