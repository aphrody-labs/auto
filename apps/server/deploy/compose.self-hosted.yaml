services:
  auto-server:
    image: oven/bun:1.4.5
    working_dir: /app
    command: ["bun", "apps/server/src/bin.ts", "--host", "0.0.0.0", "--port", "3000"]
    environment:
      AUTO_MODE: self-hosted
      AUTO_HOST: 0.0.0.0
      AUTO_PORT: "3000"
      AUTO_DB_PATH: /data/auto.sqlite
      AUTO_DATA_DIR: /data
      AUTO_MASTER_KEY: ${AUTO_MASTER_KEY}
      AUTO_URL_APP: ${AUTO_URL_APP:-http://localhost:3000}
    ports:
      - "${AUTO_PORT:-3000}:3000"
    volumes:
      - .:/app
      - auto_data:/data
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3000/health');if(!r.ok)process.exit(1)"]
      interval: 5s
      timeout: 2s
      retries: 5

  auto-lb:
    image: rust:latest
    command: ["./target/release/auto", "lb", "--listen", "0.0.0.0:8080"]
    environment:
      AUTO_UPSTREAMS: ${AUTO_UPSTREAMS:-http://auto-server:3000}
      AUTO_LB_STRATEGY: ${AUTO_LB_STRATEGY:-consistent_hash}
    ports:
      - "${AUTO_LB_PORT:-8080}:8080"
    depends_on:
      auto-server:
        condition: service_healthy

volumes:
  auto_data:
