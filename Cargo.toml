[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"

[workspace.dependencies]
# Crates publiés sur crates.io et GitHub (storytold/deckcraft, gridcraft, pdfcraft, wordcraft).
aphrody-rag-core = { version = "=1.4.7", default-features = false }
deckcraft-model = { git = "https://github.com/storytold/deckcraft", tag = "v0.6.1" }
deckcraft-pdf = { git = "https://github.com/storytold/deckcraft", tag = "v0.6.1" }
deckcraft-pptx = { git = "https://github.com/storytold/deckcraft", tag = "v0.6.1" }
gridcraft-core = { git = "https://github.com/storytold/gridcraft", tag = "v0.6.1" }
gridcraft-calc = { git = "https://github.com/storytold/gridcraft", tag = "v0.6.1" }
gridcraft-model = { git = "https://github.com/storytold/gridcraft", tag = "v0.6.1" }
gridcraft-xlsx = { git = "https://github.com/storytold/gridcraft", tag = "v0.6.1" }
pdfcraft-annot = { git = "https://github.com/storytold/pdfcraft", tag = "v0.9.0" }
pdfcraft-cos = { git = "https://github.com/storytold/pdfcraft", tag = "v0.9.0" }
pdfcraft-create = { git = "https://github.com/storytold/pdfcraft", tag = "v0.9.0" }
pdfcraft-fonts = { git = "https://github.com/storytold/pdfcraft", tag = "v0.9.0" }
pdfcraft-model = { git = "https://github.com/storytold/pdfcraft", tag = "v0.9.0" }
pdfcraft-organize = { git = "https://github.com/storytold/pdfcraft", tag = "v0.9.0" }
pdfcraft-preflight = { git = "https://github.com/storytold/pdfcraft", tag = "v0.9.0" }
pdfcraft-redact = { git = "https://github.com/storytold/pdfcraft", tag = "v0.9.0" }
pdfcraft-render = { git = "https://github.com/storytold/pdfcraft", tag = "v0.9.0" }
pdfcraft-sign = { git = "https://github.com/storytold/pdfcraft", tag = "v0.9.0" }
wordcraft-doc = { git = "https://github.com/storytold/wordcraft", tag = "v0.6.1" }
wordcraft-docx = { git = "https://github.com/storytold/wordcraft", tag = "v0.6.1" }
wordcraft-pdf = { git = "https://github.com/storytold/wordcraft", tag = "v0.6.1" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"


[profile.release]
strip = true
lto = "fat"
codegen-units = 1

[profile.dev]
split-debuginfo = "unpacked"
incremental = true
codegen-units = 16
debug = "limited"

[profile.dev.build-override]
codegen-units = 16
split-debuginfo = "unpacked"
debug = "limited"

[patch.crates-io]
hayro-interpret = { git = "https://github.com/storytold/pdfcraft", tag = "v0.9.0" }
hayro = { git = "https://github.com/storytold/pdfcraft", tag = "v0.9.0" }
hayro-syntax = { git = "https://github.com/storytold/pdfcraft", tag = "v0.9.0" }
hayro-jbig2 = { git = "https://github.com/storytold/pdfcraft", tag = "v0.9.0" }
lopdf = { git = "https://github.com/storytold/pdfcraft", tag = "v0.9.0" }
vello_common = { git = "https://github.com/storytold/pdfcraft", tag = "v0.9.0" }
