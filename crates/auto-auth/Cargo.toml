[package]
name = "auto-auth"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Modern Rust Better Auth engine: Argon2id/Scrypt passwords, ChaCha20 sessions, Ed25519 JWKS/JWT, TOTP, Passkeys (ES256), RBAC, OAuth2/MCP, SQLite & Axum router"

[features]
default = ["native"]
native = ["dep:axum", "dep:getrandom", "dep:rusqlite", "dep:tokio"]

[dependencies]
argon2.workspace = true
base64.workspace = true
chacha20poly1305.workspace = true
ed25519-dalek.workspace = true
hmac.workspace = true
p256.workspace = true
scrypt.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true

axum = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
