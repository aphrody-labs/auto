[package]
name = "aphrody-auto"
version = "2026.11.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Unified Aphrody Auto SDK library + single LTO/AOT executable: modern Rust Better Auth, billing/Factur-X/DOCX/XLSX/PPTX/PDF engines, HLC sync client, MCP router, and real-time L7 load balancer"

[lib]
name = "aphrody_auto"
path = "src/lib.rs"

[[bin]]
name = "auto"
path = "src/bin/auto.rs"

[dependencies]
auto-auth = { path = "../auto-auth" }
auto-client = { path = "../auto-client" }
auto-docs = { path = "../auto-docs" }
auto-facturx = { path = "../auto-facturx" }
auto-files = { path = "../auto-files" }
auto-i18n = { path = "../auto-i18n" }
auto-knowledge = { path = "../auto-knowledge" }
auto-model = { path = "../auto-model" }
auto-sheets = { path = "../auto-sheets" }
auto-theme = { path = "../auto-theme" }
axum.workspace = true
base64.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
