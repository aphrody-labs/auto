services:
  postgres:
    image: postgres:18-alpine
    # Dev uniquement : sans fsync, les CREATE/DROP DATABASE des tests ne bloquent plus sur le disque Docker.
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    environment:
      POSTGRES_USER: auto
      POSTGRES_PASSWORD: auto
      POSTGRES_DB: auto
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auto -d auto"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Base n8n sur le même serveur, créée aussi sur un volume déjà initialisé.
  n8n-db:
    image: postgres:18-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: auto
    command: >-
      sh -c "echo \"SELECT 'CREATE DATABASE n8n' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'n8n')\\gexec\"
      | psql -h postgres -U auto -d auto -v ON_ERROR_STOP=1"
    restart: "no"

  n8n:
    image: n8nio/n8n:2.45.2
    depends_on:
      n8n-db:
        condition: service_completed_successfully
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: auto
      DB_POSTGRESDB_PASSWORD: auto
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-auto-dev-cle-de-chiffrement}
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      GENERIC_TIMEZONE: Europe/Paris
      WEBHOOK_URL: http://localhost:5678/
      # API auto (bun run dev sur l'hôte) et secret des webhooks signés qu'elle envoie.
      AUTO_API_URL: ${AUTO_API_URL:-http://host.docker.internal:3000}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-auto-dev-secret-webhook}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_RESTRICT_FILE_ACCESS_TO: /archives
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5678:5678"
    volumes:
      - n8ndata:/home/node/.n8n
      - ./infra/n8n/workflows:/workflows:ro
      # Factures archivées par le workflow auto-evenements.
      - ./data/n8n/archives:/archives
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Stockage objet S3 des exemplaires figés (archivage 10 ans). Seau à verrou d'objet : rétention par
  # défaut GOVERNANCE 11 ans en dev (contournable par l'administrateur) ; COMPLIANCE en production.
  minio:
    # Fork communautaire (pgsty) : MinIO ne publie plus d'image Docker publique.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-auto}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-auto-dev-minio}
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/minio/health/live || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: pgsty/mc:RELEASE.2026-10-18T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}
      && mc mb --ignore-existing --with-lock local/auto-archives
      && mc retention set --default $${S3_RETENTION_MODE} 11y local/auto-archives"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-auto}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-auto-dev-minio}
      S3_RETENTION_MODE: ${S3_RETENTION_MODE:-governance}
    restart: "no"

  # Serveur de mail de dev et de test (SMTP 3025, SMTPS 3465, IMAP 3143, IMAPS 3993) : boîtes créées
  # à la première connexion, certificat auto-signé.
  greenmail:
    image: greenmail/standalone:2.1.3
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled

    ports:
      - "3025:3025"
      - "3465:3465"
      - "3143:3143"
      - "3993:3993"

volumes:
  pgdata:
  n8ndata:
  miniodata:
