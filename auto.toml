# Declarative configuration for Auto — zero hardcoded hosts, ports, secrets, or locale strings.
# Environment variables override any field below when set.

[app]
name = "Auto"
slug = "auto"
license = "Apache-2.0"
default_locale = "en"
supported_locales = ["en", "fr"]
default_currency = "EUR"
default_timezone = "UTC"

[locales]
directory = "locales"
format = "tsv"
bundles = ["common", "auto"]

[modes]
# Active runtime mode: "auto" | "serverless" | "self-hosted"
# Resolved dynamically via AUTO_MODE or presence of Cloudflare bindings / local SQLite config.
default = "auto"

[modes.serverless]
worker_name = "auto"
durable_object = "CompanyDO"
workflow = "AutomationWorkflow"
d1_binding = "DB"
assets_binding = "ASSETS"
rate_limit_binding = "RATE_LIMITER"
ai_binding = "AI"
public_base_url_env = "AUTO_URL_APP"

[modes.self_hosted]
host_env = "AUTO_HOST"
default_host = "0.0.0.0"
port_env = "AUTO_PORT"
default_port = 3000
data_dir_env = "AUTO_DATA_DIR"
default_data_dir = "data"
db_path_env = "AUTO_DB_PATH"
sync_interval_ms = 5000
realtime_ws = true

[cluster.load_balancer]
strategy = "consistent_hash" # "round_robin" | "least_connections" | "consistent_hash"
health_path = "/health"
health_interval_ms = 5000
health_timeout_ms = 2000
unhealthy_threshold = 2
healthy_threshold = 1
upstreams_env = "AUTO_UPSTREAMS"
sticky_header = "x-company-id"

[storage.prefixes]
# Shared R2 buckets consolidated under prefix isolation (no dedicated Auto buckets needed).
assets_bucket = "aphrody-assets"
assets_prefix = "auto/assets/"
backups_bucket = "aphrody-backups"
backups_prefix = "auto/archives/"
backups_retention_days = 4015 # 11 years statutory archive retention
releases_bucket = "aphrody-releases"
releases_prefix = "auto/releases/"

[build]
wasm_target = "wasm32-unknown-unknown"
rust_profile = "release"
desktop_crate = "apps/desktop"
sdk_crate = "crates/auto-sdk"
ffi_crate = "crates/auto-ffi"
ui_app = "apps/ui"
server_app = "apps/server"
cli_app = "apps/cli"
extension_app = "apps/extension"
